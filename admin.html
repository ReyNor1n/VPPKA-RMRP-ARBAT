<style>
.wrap{max-width:1000px;margin:auto;padding:24px}
.box{background:#1e1a15;border:1px solid var(--ln);padding:22px;margin:16px 0;clip-path:none}
header{border-bottom:1px solid var(--ln)}
.nav{display:flex;align-items:center;height:72px;max-width:1000px;margin:auto;padding:0 24px;position:static;border:0;background:none}
.brand{display:flex;gap:12px;align-items:center;color:#f3ead8;font:500 18px var(--fd)}
.brand img{height:46px;filter:none}
label{display:block;font:12px var(--fd);text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin-top:10px}
input,textarea,select{width:100%;padding:9px 10px;background:#14110e;color:var(--tx);border:1px solid var(--ln);font:inherit;border-radius:0}
input:focus,textarea:focus{outline:1px solid var(--red);box-shadow:none}
textarea{min-height:80px}
fieldset{border:1px solid var(--ln);margin:10px 0;padding:10px 14px}
legend{font:13px var(--fd);color:var(--red);padding:0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.del{background:none;color:var(--red);border:1px solid var(--red);padding:4px 10px;cursor:pointer}
.add{background:none;color:var(--gold);border:1px solid var(--gold);padding:7px 14px;cursor:pointer;margin:6px 0}
.tabs button{margin:3px}
.thumb{max-height:60px;margin-top:6px}
#msg{position:fixed;bottom:16px;right:16px;background:var(--red);color:#fff;padding:12px 18px;display:none;box-shadow:none}
</style>

<header><div class="nav"><a class="brand" href="index.html"><img src="img/emblem.png?v=258" alt=""><span>ВППКА · Админ</span></a></div></header>
<div class="wrap">
<div id="login" class="box"><h2>Вход владельца</h2>
<p>Изменения публикуются прямо в ваш репозиторий GitHub. Опубликовать что-либо может только тот, у кого есть ваш личный токен GitHub с доступом к репозиторию — то есть только вы. Токен хранится только в этом браузере.</p>
<label for="repo">Репозиторий (владелец/имя)</label><input id="repo" value="ReyNor1n/VPPKA-RMRP-ARBAT">
<label for="branch">Ветка</label><input id="branch" value="main">
<label for="token">Личный токен GitHub (fine-grained, права Contents: Read and write только на этот репозиторий)</label><input id="token" type="password">
<div class="row" style="margin-top:12px"><button class="btn" id="b-login">Войти</button><button class="btn sm" id="b-offline">Локальный режим (без публикации, только экспорт файла)</button></div>
</div>
<div id="ed" style="display:none">
<div class="box row"><button class="btn sm" id="b-publish">💾 Опубликовать на сайт</button><button class="btn sm" id="b-preview">👁 Предпросмотр</button><button class="btn sm" id="b-export">⬇ Скачать content.json</button>
<label class="btn sm">⬆ Загрузить content.json<input type="file" accept=".json" hidden id="b-import"></label><button class="del" id="b-logout">Выйти</button></div>
<div class="box tabs" id="tabs"></div><div class="box" id="form"></div>
</div>
</div>
<div id="msg"></div>
